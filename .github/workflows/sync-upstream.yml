name: Sync upstream releases

on:
  workflow_dispatch:
    inputs:
      librustzcash_ref:
        description: "zcash/librustzcash tag or commit (blank keeps current pin)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out wallet libraries
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refresh selected upstream trees
        env:
          LIBRUSTZCASH_REF: ${{ inputs.librustzcash_ref }}
        run: |
          args=()
          if [[ -n "$LIBRUSTZCASH_REF" ]]; then
            args+=("librustzcash=$LIBRUSTZCASH_REF")
          fi
          ./scripts/sync-upstream.sh "${args[@]}"

      - name: Verify Zakura source snapshot
        run: ./scripts/verify-zakura-import.sh

      - name: Verify zcash_voting compatibility
        run: ./scripts/verify-zcash-voting.sh

      - name: Open upstream sync pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: adam/automation-upstream-sync
          delete-branch: true
          commit-message: "chore: sync upstream wallet libraries"
          title: "DRAFT: Sync upstream wallet libraries"
          draft: true
          body: |
            Refreshes the pinned upstream LRZ source tree and reapplies the
            minimal voting patch set. The Zakura source snapshot remains pinned.

            `zcash_voting` verification passed before this PR was opened.
